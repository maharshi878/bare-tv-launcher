<!doctype html><meta charset=utf-8><title>Bare mockup</title>
<style>
html,body{margin:0;background:#000;color:#fff;font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
#tv{width:960px;height:540px;box-sizing:border-box;padding:36px 56px 0;position:relative;overflow:hidden}
.time{font-size:56px;font-weight:300;line-height:66px}
.date{font-size:18px;color:#8c8c8c}
.grid{margin-top:36px;padding-top:8px;display:grid;grid-template-columns:repeat(auto-fill,150px);gap:10px;justify-content:space-between}
.cell{height:132px;box-sizing:border-box;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;border-radius:14px;border:2px solid transparent}
.cell.sel{background:rgba(255,255,255,.18);border-color:#fff}
.ic{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.lb{margin-top:10px;font-size:14px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;background:#2b2b2b;border-radius:4px;box-shadow:0 8px 40px #000}
.dlg h3{margin:0;padding:20px 24px 12px;font-size:20px;font-weight:400}
.dlg div{padding:14px 24px;font-size:16px}.dlg div.f{background:rgba(255,255,255,.18)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6)}
</style>
<div id=tv><div class=time>8:42</div><div class=date>Monday, 19 October</div><div class=grid id=g></div></div>
<script>
const apps=[["Disney+","#113ccf","D"],["Files","#f5b400","F"],["Jellyfin","#7b5cff","J"],["Kodi","#1f8fd1","K"],["Netflix","#e50914","N"],["Play Store","#34a853","▶"],["Plex","#e5a00d","P"],["Prime Video","#00a8e1","P"],["SmartTube","#c4302b","S"],["VLC","#ff8800","V"],["YouTube","#ff0000","Y"],["Settings","#3a3a3a","⚙"]];
const q=new URLSearchParams(location.search),sel=+(q.get("sel")||0),menu=q.get("menu");
g.innerHTML=apps.map((a,i)=>`<div class="cell ${i==sel?'sel':''}"><div class=ic style="background:${a[1]}">${a[2]}</div><div class=lb>${a[0]}</div></div>`).join("");
if(menu){tv.insertAdjacentHTML("beforeend",`<div class=scrim></div><div class=dlg><h3>${apps[sel][0]}</h3><div class=f>App info</div><div>Uninstall</div><div>Hide from launcher</div></div>`)}
</script>
