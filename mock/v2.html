<!doctype html><meta charset=utf-8><title>Bare v2 mockup</title>
<style>
html,body{margin:0;background:#060608;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
#tv{width:960px;height:540px;position:relative;overflow:hidden;transition:background .5s}
.hdr{position:absolute;left:64px;right:64px;top:36px;display:flex;justify-content:space-between}
.time{font-size:78px;font-weight:100;line-height:78px;letter-spacing:-1px}
.date{font-size:16px;color:rgba(255,255,255,.6);letter-spacing:.06em;margin:4px 0 0 4px}
.links{display:flex;gap:2px;align-items:flex-start}
.links span{font-size:15px;color:rgba(255,255,255,.6);padding:8px 16px;border-radius:18px;letter-spacing:.04em}
.links i{font-style:normal;color:#4ade80}
.row{position:absolute;left:0;top:178px;height:230px;width:960px}
.t{position:absolute;top:53px;width:124px;height:124px;border-radius:30px;background:rgba(255,255,255,.08);transition:all .25s;display:flex;align-items:center;justify-content:center}
.ic{width:84px;height:84px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:40px;color:#fff}
.t.f{background:rgba(255,255,255,.19)}
.title{position:absolute;left:0;right:0;top:416px;text-align:center;font-size:38px;font-weight:300}
.hint{position:absolute;left:0;right:0;bottom:28px;text-align:center;font-size:13px;letter-spacing:.08em;color:rgba(255,255,255,.33)}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:300px;background:#2b2b2b;border-radius:4px;box-shadow:0 8px 40px #000}
.dlg h3{margin:0;padding:20px 24px 12px;font-size:20px;font-weight:400}.dlg div{padding:14px 24px;font-size:16px}.dlg .s{background:rgba(255,255,255,.18)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
</style>
<div id=tv>
<div class=hdr><div><div class=time>8:42</div><div class=date>Monday, 19 October</div></div>
<div class=links><span><i>●</i> Wi-Fi</span><span>Inputs</span><span>Settings</span></div></div>
<div class=row id=row></div><div class=title id=ti></div>
<div class=hint>OK &nbsp;open &nbsp;&nbsp;·&nbsp;&nbsp; hold OK &nbsp;options</div></div>
<script>
const A=[["Disney+","#2a52e8","D","#2a52be"],["Files","#f5b400","F","#b8860b"],["Jellyfin","#8b6cff","J","#6a4fd0"],["Kodi","#1f8fd1","K","#1a78b0"],["Netflix","#e50914","N","#a3060e"],["Plex","#e5a00d","P","#b07c0a"],["Prime Video","#00a8e1","P","#0a86b0"],["SmartTube","#e0392f","S","#a52a22"],["VLC","#ff8800","V","#c46a00"],["YouTube","#ff0000","Y","#b00000"],["+ Add","","+","#3a4b73"]];
const q=new URLSearchParams(location.search),sel=+(q.get("sel")||0);
const W=960,T=124,G=34,step=T+G;
row.innerHTML=A.map((a,i)=>{const d=Math.abs(i-sel),s=d==0?1.3:d==1?.94:.84,o=d==0?1:d==1?.8:.5;
const x=W/2-T/2+(i-sel)*step;
const inner=a[2]=="+"?`<span style="font-size:60px;font-weight:300">+</span>`:`<div class=ic style="background:${a[1]}">${a[2]}</div>`;
return `<div class="t ${d==0?'f':''}" style="left:${x}px;transform:scale(${s});opacity:${o}">${inner}</div>`}).join("");
ti.textContent=A[sel][0]=="+ Add"?"Add to home":A[sel][0];
tv.style.background=`radial-gradient(ellipse 72% 90% at 50% 52%, ${A[sel][3]}d0 0%, ${A[sel][3]}58 50%, transparent 100%), #060608`;
if(q.get("menu")){tv.insertAdjacentHTML("beforeend",`<div class=scrim></div><div class=dlg><h3>Add to home</h3><div class=s>Custom shortcut…</div><div>Show hidden apps (2)…</div></div>`)}
</script>
